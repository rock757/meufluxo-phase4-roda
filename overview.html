:root{--cream:#f7f3ee;--paper:#fffdf9;--ink:#2a2440;--ink-2:#4a4361;--muted:#7b748c;--line:#e6e0d6;--purple:#5a3fb4;--purple-2:#8a6fd3;--lilac:#ebe4f8;--lilac-2:#d7cbf2;--deep:#2d2047;--gold:#c9a24f;--green:#2f7d5b;
 --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;--sans:"Google Sans Flex",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}a{color:var(--purple)}img{max-width:100%}
.deck{display:flex;align-items:flex-start;overflow:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;height:100vh}
.deck::-webkit-scrollbar{display:none}
.page{flex:0 0 100vw;scroll-snap-align:start;min-height:100vh;padding:24px 52px 90px;display:flex;flex-direction:column;position:relative}
.page>*{flex-shrink:0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:18px}
.bar .lang{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px;margin-left:14px;vertical-align:middle;letter-spacing:1px}
.bar .lang button{border:0;background:transparent;padding:3px 9px;border-radius:99px;color:var(--muted);font-size:11px;letter-spacing:1px}
.bar .lang button.on{background:var(--ink);color:#fff}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--purple);font-weight:700}
h2{font:400 clamp(30px,3.6vw,46px)/1.1 var(--serif);letter-spacing:-.015em;margin:8px 0 6px}
.lead{font-size:clamp(16px,1.4vw,19px);color:var(--ink-2);margin:0 0 22px;max-width:720px}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin-top:auto;padding-top:26px}
.steps .eyebrow{font-size:10px}.steps h3{font:400 clamp(18px,1.6vw,22px)/1.2 var(--serif);margin:8px 0 6px}.steps p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.nav{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;z-index:5}
.nav button{border:1px solid var(--line);background:var(--paper);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 20px -12px rgba(42,36,64,.5)}
.dots{display:flex;gap:6px;padding:0 8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--lilac-2);display:block}.dots i.on{background:var(--purple)}
.label{position:absolute;bottom:22px;right:52px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
/* page 1 */
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 16px;position:relative}
.strip::before{content:"";position:absolute;left:8%;right:8%;top:24px;border-top:1px solid var(--line)}
.strip button{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 10px 12px;text-align:center;transition:all .18s}
.strip button .n{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--lilac);color:var(--purple);display:grid;place-items:center;font-weight:700;font-size:12px}
.strip button b{display:block;font:400 17px/1.15 var(--serif)}
.strip button[aria-pressed=true]{border-color:var(--purple);box-shadow:0 14px 30px -22px rgba(90,63,180,.6)}
.strip button[aria-pressed=true] .n{background:var(--purple);color:#fff}
.shot{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -40px rgba(42,36,64,.5)}
.shot img{display:block;width:100%}
.shot .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(42,36,64,.85));color:#fff;padding:26px 18px 14px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.shot .cap b{font:400 20px/1.2 var(--serif)}.shot .cap a{color:#fff;font-size:13px;white-space:nowrap;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:99px;text-decoration:none}
/* page 2 */
.try{display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center}
.wheel{width:100%;max-width:360px;margin:0 auto;display:block}
.wheel polygon{fill:var(--lilac-2);stroke:#fff;stroke-width:2;cursor:pointer;transition:fill .2s}.wheel polygon:hover{fill:var(--purple-2)}.wheel polygon.on{fill:var(--purple)}
.wheel text{font:700 12px var(--sans);fill:var(--ink);pointer-events:none}
.result{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(42,36,64,.5)}
.result img.cv{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.result .body{padding:18px 22px 20px}.result .body .eyebrow{font-size:10px}
.result h3{font:400 clamp(24px,2.6vw,32px)/1.1 var(--serif);margin:6px 0 6px}
.result .who{display:flex;gap:10px;align-items:center;margin-top:10px}.result .who img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.result .who small{display:block;color:var(--muted);font-size:12px}
.seqmini{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:18px}
.seqmini div{text-align:center;font-size:11px;color:var(--muted);line-height:1.2}
.seqmini img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;display:block;margin-bottom:5px;border:2px solid transparent}
.seqmini div.on img{border-color:var(--purple)}.seqmini div.seed img{border-color:var(--gold)}
/* page 3 */
.sp{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:start}
.sp svg{width:100%;height:auto}.sp rect{pointer-events:none}.sp path.arc{fill:none;stroke-width:22;cursor:pointer;transition:opacity .2s}.sp path.arc.dim{opacity:.35}
.lvls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lvls button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.lvls button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font:400 clamp(22px,2.4vw,30px)/1.1 var(--serif);margin:4px 0 4px}
.faces{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.faces button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px 5px 5px;font-size:13px;font-weight:600}
.faces img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.faces button[aria-pressed=true]{border-color:var(--purple);background:var(--lilac)}
.pcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcs div{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pcs img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.pcs b{display:block;font-size:13px;padding:8px 10px 10px;line-height:1.2}
/* page 4 */
.paths{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.path{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:all .18s}
.path .eb{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--purple);font-weight:700}
.path b{font:400 22px/1.15 var(--serif)}.path .pr{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.path small{color:var(--muted);font-size:12.5px}
.path:hover,.path[aria-pressed=true]{border-color:var(--purple);box-shadow:0 14px 30px -22px rgba(90,63,180,.6)}
.path[aria-pressed=true]{background:var(--lilac)}
.flow{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;align-items:start}
.stage{background:var(--deep);color:#fff;border-radius:18px;padding:22px;min-height:300px;display:flex;flex-direction:column;gap:12px}
.stage .eb{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#cdbff0;font-weight:700}
.stage h3{font:400 clamp(22px,2.6vw,32px)/1.12 var(--serif);margin:0}
.stage .pr{font-size:40px;font-weight:800;letter-spacing:-.02em}
.stage p{margin:0;color:#d9d1f0;font-size:15px}
.stage .acts{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.stage .acts button{border:0;border-radius:99px;padding:12px 18px;font-weight:700}
.stage .yes{background:#fff;color:var(--purple)}.stage .no{background:rgba(255,255,255,.14);color:#fff}
.trail{display:flex;flex-wrap:wrap;gap:6px}
.trail span{font-size:11px;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;color:#e6dff5}
.trail span.ok{background:rgba(47,125,91,.5)}.trail span.no{background:rgba(255,255,255,.08);text-decoration:line-through}
.side .k{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.side .k b{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:4px}
.side .k .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.side .k small{color:var(--muted);font-size:12.5px;display:block}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--paper);margin:0 0 14px}
.toggle button{border:0;background:transparent;padding:6px 12px;border-radius:99px;font-size:12.5px;color:var(--muted)}
.toggle button.on{background:var(--ink);color:#fff}
/* page 5 calculator */
.calc{display:grid;grid-template-columns:.95fr 1.25fr;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.card-label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.scen{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.scen button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600}
.scen button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scen .hint{font-size:11.5px;color:var(--muted)}
label.f{display:block;margin-bottom:10px}
.fh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600}
.fh small{font-weight:500;color:var(--muted);font-size:11px}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;height:38px;margin-top:4px}
.in span{padding:0 10px;font-size:12.5px;color:var(--muted);background:#f5f2ee;height:100%;display:flex;align-items:center}
.in input{border:0;outline:0;width:100%;height:100%;padding:0 10px;font:600 15px var(--sans);color:var(--ink);background:transparent}
.in input::-webkit-outer-spin-button,.in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:var(--deep);border-radius:16px;padding:20px;color:#fff}
.hero .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#cdbff0;font-weight:700}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;color:#f1dca0;line-height:1;margin-top:4px}
.hero .sub{font-size:12.5px;color:#cdbff0;margin-top:4px}
.hero .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
.hero .kpis div{background:rgba(255,255,255,.07);border-radius:12px;padding:12px}
.hero .kpis .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero .kpis .l{font-size:11px;color:#cdbff0;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.layers{display:flex;height:26px;border-radius:6px;overflow:hidden;margin-top:16px}
.layers div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:width .2s}
.legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:11px;color:#cdbff0}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.rows .r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.rows .mid{flex:1;min-width:0}.rows .nm{font-size:13.5px;font-weight:600}.rows .ct{font-size:11.5px;color:var(--muted)}
.rows .rv{text-align:right}.rows .rv b{font-size:14px;display:block}.rows .rv small{font-size:11px;color:var(--muted)}
.total{display:flex;justify-content:space-between;padding-top:10px;font-weight:800}
.fine{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
details.appendix{margin-top:14px;font-size:13px;color:var(--ink-2)}
details.appendix summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.appendix ul{margin:8px 0 0;padding-left:18px}
/* page 6 painel */
.p6{display:grid;grid-template-columns:.9fr 1.3fr;gap:18px;align-items:start}
.flow6{display:grid;gap:8px}
.flow6 .f{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;position:relative}
.flow6 .f img{width:64px;height:42px;object-fit:cover;object-position:top;border-radius:6px;display:block}
.flow6 .f b{display:block;font:400 17px/1.1 var(--serif)}.flow6 .f small{display:block;color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
.flow6 .f::after{content:"↓";position:absolute;left:50%;bottom:-13px;color:var(--purple);font-size:12px;background:var(--cream);padding:0 4px;z-index:1}.flow6 .f:last-child::after{display:none}
.dest6{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dest6 span{font-size:11.5px;background:var(--lilac);border-radius:99px;padding:5px 10px;color:var(--ink)}.dest6 span b{color:var(--purple);font-weight:700}
@media(max-width:900px){.p6{grid-template-columns:1fr}}
@media(max-width:900px){.deck{display:block;height:auto;overflow:visible}.page{flex:none;min-height:0;padding:20px 18px 50px;border-bottom:1px solid var(--line)}
 .strip{grid-template-columns:1fr 1fr 1fr}.strip::before{display:none}.try,.sp,.flow,.calc,.paths,.steps{grid-template-columns:1fr}.seqmini{grid-template-columns:repeat(4,1fr)}.pcs{grid-template-columns:1fr 1fr}.nav{display:none}.label{position:static;margin-top:16px}.hero .kpis{grid-template-columns:1fr}}
@media print{.nav{display:none}.page{page-break-after:always;min-height:0;height:auto}}
</style>
</head>

const PATHS={A:{entry:['p1',P1],chain:[['p8',P8,'up'],['p5',P5,'up']]},B:{entry:['p8',P8],chain:[['p5',P5,'up'],['p1',P1,'down']]},C:{entry:['p5',P5],chain:[['p8',P8,'down'],['p1',P1,'down']]}};

let path='C', credit=true, st=null;
function resetPath(){st={step:0,paid:0,owns:null,trail:[],done:false}}
function offerPrice(id,price){if(!credit||!st.owns)return price;const rank={p1:1,p8:2,p5:3};return rank[id]>rank[st.owns]?Math.max(0,price-st.paid):price}
function currentOffer(){const P=PATHS[path];if(st.step===0)return {id:P.entry[0],price:P.entry[1],kind:'entry'};const c=P.chain[st.step-1];return c?{id:c[0],price:c[1],kind:c[2]}:null}
function act(yes){const o=currentOffer();if(!o)return;const price=offerPrice(o.id,o.price);
 if(yes){st.paid+=price;st.owns=o.id;st.trail.push({id:o.id,ok:true,price})}else st.trail.push({id:o.id,ok:false});
 // routing: after entry → chain[0]; 'up' offers need a buyer; 'down' offers need a decliner
 let next=st.step+1;const P=PATHS[path];
 while(true){const c=P.chain[next-1];if(!c){st.done=true;break}
  if(c[2]==='up'&&!yes){st.done=true;break} // no upgrade path for a decliner at entry/upsell
  if(c[2]==='down'&&yes){st.done=true;break} // buyer does not see downsells
  st.step=next;break}
 renderStage()}

 :`<span class="eb">${esc(p.end)}</span><h3>${st.owns?esc(t(NAME[st.owns])):(L==='en'?'No purchase':'Sem compra')}</h3><div class="pr">${brl(st.paid)}</div><div class="trail">${trail}</div><div class="acts"><button class="yes" id="restart">${esc(p.restart)} ↻</button></div>`;

 const y=document.getElementById('yes'),n=document.getElementById('no'),r=document.getElementById('restart');if(y)y.onclick=()=>act(true);if(n)n.onclick=()=>act(false);if(r)r.onclick=()=>{resetPath();renderStage()}}

 root.querySelectorAll('#cscen button').forEach(b=>b.onclick=()=>{cscen=Number(b.dataset.i);Object.assign(cv,SCEN[cscen]);bindCalc();renderCalc()});
 ['N','conv','upA','upB','downB','downA'].forEach(k=>{const el=root.querySelector('#c_'+k);if(el)el.oninput=()=>{cv[k]=Math.max(0,Number(el.value)||0);if(k!=='N')cscen=-1;root.querySelectorAll('#cscen button').forEach(b=>b.classList.toggle('on',Number(b.dataset.i)===cscen));renderCalc()}});
 root.querySelector('#c_credit').onchange=e=>{ccredit=e.target.checked;renderCalc()}}
/* ---- pages ---- */
const pages=[
 ()=>{const p=S.p1;return bar(1)+head(p)+`<div class="strip">${p.strip.map((s,i)=>`<button data-shot="${i}" aria-pressed="${i===0}"><span class="n">${i+1}</span><b>${esc(s[0])}</b></button>`).join('')}</div><div class="shot" id="shot"></div>`+steps(p.steps)},
 ()=>{const p=S.p2;return bar(2)+head(p)+`<div class="try"><div id="w2">${wheel(prio)}</div><div id="res"></div></div><p class="eyebrow" style="margin-top:18px">${esc(p.seq)}</p><div class="seqmini" id="seqmini">${seqMini()}</div>`+steps(p.steps)},
 ()=>{const p=S.p3;return bar(3)+head(p)+`<div class="sp"><div id="spsvg">${spiral(2)}</div><div><div class="lvls" id="lvls">${LEVELS.map((l,k)=>k===0?'':`<button data-lv="${k}" aria-pressed="${k===2}">${l.num} — ${esc(t(l.name))}</button>`).join('')}</div><div class="panel" id="lvlpanel"></div></div></div>`+steps(p.steps)},
 ()=>{const p=S.p4;return bar(4)+head(p)+`<div class="paths">${p.paths.map((x,i)=>{const k=['A','B','C'][i];return `<button class="path" data-path="${k}" aria-pressed="${k===path}"><span class="eb">${esc(x[0])}</span><b>${esc(x[1])}</b><span class="pr">${brl(x[2])}</span><small>${esc(x[3])}</small></button>`}).join('')}</div>
  <div class="toggle" id="credit"><button class="${credit?'on':''}" data-c="1">${esc(p.credit[0])}</button><button class="${credit?'':'on'}" data-c="0">${esc(p.credit[1])}</button></div>
  <div class="flow"><div class="stage" id="stage"></div><div class="side" id="side"></div></div>`+steps(p.steps)},
 ()=>{const p=S.p5;return bar(5)+head(p)+`<div class="calc"><div id="calcin"></div><div id="calcout"></div></div><details class="appendix"><summary>${esc(p.appendix)}</summary><ul>${p.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></details>`+steps(p.steps)},
 ()=>{const p=S.p6;return bar(6)+head(p)+`<div class="p6"><div><div class="flow6">${p.flow.map(f=>`<div class="f"><img src="${f[2]}" alt=""><div><b>${esc(f[0])}</b><small>${esc(f[1])}</small></div></div>`).join('')}</div><div class="dest6">${p.dest.map(d=>`<span><b>${esc(d[0])}</b> · ${esc(d[1])}</span>`).join('')}</div><p style="margin:12px 0 0"><a href="painel.html${L==='en'?'?lang=en':''}" target="_blank" rel="noopener">${esc(p.open)}</a></p></div><div id="painel6"></div></div>`+steps(p.steps)+`<span class="label">${esc(S.label)}</span>`}
];
const deck=document.getElementById('deck');
function render(){deck.innerHTML=pages.map((f,i)=>`<section class="page" id="p${i+1}">${f()}</section>`).join('');
 document.getElementById('dots').innerHTML=pages.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
 // p1 screenshots
 const showShot=i=>{const s=S.p1.strip[i];document.getElementById('shot').innerHTML=`<img src="img/shots/${s[1]}.jpg" alt="${esc(s[0])}"><div class="cap"><b>${i+1}. ${esc(s[0])} — ${esc(s[2])}</b><a href="${LIVE+liveFor[i]}" target="_blank" rel="noopener">${esc(S.p1.open)} ↗</a></div>`;deck.querySelectorAll('[data-shot]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.shot)===i))};showShot(0);
 deck.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>showShot(Number(b.dataset.shot)));
 // p2 wheel
 const res=()=>{const fp=firstProgram();const c=progOf(fp.programa);document.getElementById('res').innerHTML=`<div class="result">${c&&c.cover?`<img class="cv" src="${c.cover}" alt="">`:''}<div class="body"><span class="eyebrow">${esc(S.p2.res)} · ${prio+1} — ${esc(t(AREAS[prio].n))}</span><h3>${esc(fp.programa||'')}</h3><p style="margin:0;color:var(--ink-2);font-size:15px">${esc(oneLiner(fp.programa))}</p><div class="who"><img src="${face(fp.especialista)}" alt=""><div><b>${esc(fp.especialista||'')}</b><small>${esc(S.p2.with)} ${esc(fp.especialista||'')}</small></div></div></div></div>`;document.getElementById('seqmini').innerHTML=seqMini()};
 const bindWheel=()=>deck.querySelectorAll('#w2 polygon').forEach(pg=>pg.onclick=()=>{prio=Number(pg.dataset.i);document.getElementById('w2').innerHTML=wheel(prio);bindWheel();res()});bindWheel();res();
 // p3 spiral
 const selLv=k=>{document.getElementById('spsvg').innerHTML=spiral(k);bindArcs();deck.querySelectorAll('#lvls button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.lv)===k));const l=LEVELS[k];const specs=SPECS.filter(s=>s.level===k);const progs=[];specs.forEach(s=>s.programs.forEach(p=>progs.push([p,s])));
  document.getElementById('lvlpanel').innerHTML=`<span class="eyebrow">${l.num}</span><h3>${esc(t(l.name))}</h3><p style="margin:0;color:var(--muted);font-size:14px">${esc(t(l.sub))} · ${esc(S.p3.areas)}: ${l.areas.map(i=>`${i+1} — ${esc(t(AREAS[i].n))}`).join(', ')}</p><div class="faces">${specs.map(s=>`<button data-s="${s.slug}"><img src="img/approved/${s.slug}-sq.jpg" alt="">${esc(s.name)}</button>`).join('')}</div><div class="pcs" id="pcs">${progs.slice(0,6).map(([p,s])=>`<div data-spec="${s.slug}"><img src="${cover(p)}" alt="" loading="lazy"><b>${esc(p)}</b></div>`).join('')}</div>`;
  document.querySelectorAll('#lvlpanel .faces button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';document.querySelectorAll('#lvlpanel .faces button').forEach(x=>x.setAttribute('aria-pressed','false'));const s=specs.find(x=>x.slug===b.dataset.s);const list=on?progs:progs.filter(([p,x])=>x.slug===s.slug);if(!on)b.setAttribute('aria-pressed','true');document.getElementById('pcs').innerHTML=list.slice(0,6).map(([p,x])=>`<div><img src="${cover(p)}" alt="" loading="lazy"><b>${esc(p)}</b></div>`).join('')})};
 const bindArcs=()=>document.querySelectorAll('#spsvg path.arc').forEach(a=>a.onclick=()=>{const k=Number(a.dataset.lv);if(k>0)selLv(k)});
 deck.querySelectorAll('#lvls button').forEach(b=>b.onclick=()=>selLv(Number(b.dataset.lv)));selLv(2);
 // p4 paths
 resetPath();renderStage();
 deck.querySelectorAll('.path').forEach(b=>b.onclick=()=>{path=b.dataset.path;deck.querySelectorAll('.path').forEach(x=>x.setAttribute('aria-pressed',x===b));resetPath();renderStage()});
 deck.querySelectorAll('#credit button').forEach(b=>b.onclick=()=>{credit=b.dataset.c==='1';deck.querySelectorAll('#credit button').forEach(x=>x.classList.toggle('on',x===b));resetPath();renderStage()});
 // p5 calculator
 bindCalc();renderCalc();
 // p6 painel
 (async()=>{const el=document.getElementById('painel6');if(!el||!window.MF_PAINEL)return;const d=await window.MF_PAINEL.load();if(!d.configured)d.demo=true;window.MF_PAINEL.render(el,d,L)})();
 deck.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const p=new URLSearchParams(location.search);if(b.dataset.lang==='en')p.set('lang','en');else p.delete('lang');location.search=p.toString()});
}
render();
let cur=0;const n=pages.length;const goTo=i=>{cur=Math.max(0,Math.min(n-1,i));deck.scrollTo({left:cur*deck.clientWidth,behavior:'smooth'});document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===cur))};
document.getElementById('prev').onclick=()=>goTo(cur-1);document.getElementById('next').onclick=()=>goTo(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown')goTo(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')goTo(cur-1)});
deck.addEventListener('scroll',()=>{const i=Math.round(deck.scrollLeft/deck.clientWidth);if(i!==cur){cur=i;document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===cur))}});
})();
</script>
</body>
</html>

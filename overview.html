<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MeuFluxo · Fase 4 · Visão geral</title>
<link rel="icon" href="img/brand-badge.svg">
<style>
@font-face{font-family:"Google Sans Flex";src:url(img/fonts/google-sans-flex-latin.woff2) format("woff2");font-weight:300 800;font-display:swap}
:root{--cream:#f7f3ee;--paper:#fffdf9;--ink:#2a2440;--ink-2:#4a4361;--muted:#7b748c;--line:#e6e0d6;
 --purple:#5a3fb4;--purple-2:#8a6fd3;--lilac:#ebe4f8;--lilac-2:#d7cbf2;--deep:#2d2047;--gold:#c9a24f;
 --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;--sans:"Google Sans Flex",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--purple)}
.deck{display:flex;align-items:flex-start;overflow:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;height:100vh}
.deck::-webkit-scrollbar{display:none}
.page{flex:0 0 100vw;scroll-snap-align:start;min-height:100vh;padding:28px 56px 90px;display:flex;flex-direction:column;position:relative}
.page>*{flex-shrink:0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:28px}
.bar .lang{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px;margin-left:14px;vertical-align:middle;letter-spacing:1px}
.bar .lang button{border:0;background:transparent;padding:3px 9px;border-radius:99px;color:var(--muted);font-size:11px;letter-spacing:1px}
.bar .lang button.on{background:var(--ink);color:#fff}
.statement{font:400 clamp(24px,2.6vw,34px)/1.2 var(--serif);letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 34px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--purple);font-weight:700}
h2{font:400 clamp(30px,3.6vw,46px)/1.12 var(--serif);letter-spacing:-.015em;margin:10px 0 8px}
.lead{font-size:clamp(16px,1.5vw,20px);color:var(--ink-2);margin:0 0 34px;max-width:760px}
.visual{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;align-items:center;position:relative;margin-bottom:34px}
.visual::before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:1px solid var(--line);z-index:0}
.visual>*{position:relative;z-index:1}
.card{background:var(--lilac);border-radius:14px;padding:26px 28px;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.card .eyebrow{font-size:10px;margin-bottom:12px}
.card .big{font:400 clamp(22px,2.2vw,30px)/1.15 var(--serif)}
.card small{display:block;color:var(--muted);font-size:12px;margin-top:12px}
.card.dark{background:var(--deep);color:#fff;align-items:center;text-align:center}
.card.dark .eyebrow{color:#cdbff0}
.card.dark small{color:#b9afd6}
.play{width:46px;height:46px;border-radius:50%;background:#7a5fcf;display:grid;place-items:center;margin-bottom:18px}
.play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin-top:auto}
.steps .eyebrow{font-size:10px}
.steps h3{font:400 clamp(18px,1.6vw,22px)/1.2 var(--serif);margin:8px 0 8px}
.steps p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.nav{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center;z-index:5}
.nav button{border:1px solid var(--line);background:var(--paper);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 20px -12px rgba(42,36,64,.5)}
.dots{display:flex;gap:6px;padding:0 8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--lilac-2);display:block}
.dots i.on{background:var(--purple)}
/* wheel */
.wheel{width:100%;max-width:240px;margin:0 auto;display:block}
.wheel polygon{fill:var(--lilac-2);stroke:#fff;stroke-width:2;cursor:pointer;transition:fill .2s}
.wheel polygon:hover{fill:var(--purple-2)}
.wheel polygon.on{fill:var(--purple)}
.wheel text{font:600 10px var(--sans);fill:var(--muted);pointer-events:none}
/* flow */
.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:stretch;position:relative;margin-bottom:28px}
.flow::before{content:"";position:absolute;left:6%;right:6%;top:36px;border-top:1px solid var(--line)}
.node{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 12px 12px;text-align:left;transition:all .18s;display:flex;flex-direction:column;gap:6px;min-height:120px}
.node .n{width:30px;height:30px;border-radius:50%;background:var(--lilac);color:var(--purple);display:grid;place-items:center;font-weight:700;font-size:12px;margin:-28px 0 6px}
.node b{font:400 17px/1.2 var(--serif)}
.node small{color:var(--muted);font-size:12px;line-height:1.35}
.node:hover,.node[aria-pressed=true]{border-color:var(--purple);box-shadow:0 14px 30px -22px rgba(90,63,180,.6);transform:translateY(-2px)}
.node[aria-pressed=true] .n{background:var(--purple);color:#fff}
.detail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:30px}
.detail b{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.detail p{margin:0;font-size:14.5px;color:var(--ink-2)}
/* spiral */
.spiral{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;align-items:center;margin-bottom:28px}
.spiral svg{width:100%;height:auto}
.spiral path{fill:none;stroke-width:18;stroke-linecap:butt}
.order{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order li{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;animation:rise .5s both}
.order img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.order b{display:block;font-size:13.5px;line-height:1.15}
.order small{display:block;color:var(--muted);font-size:11.5px}
.order .k{width:22px;height:22px;border-radius:50%;background:var(--lilac);color:var(--purple);font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 22px}
.order li.seed .k{background:var(--gold);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* offers */
.offers{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:18px;align-items:stretch;margin-bottom:30px}
.offer{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:8px}
.offer.main{background:var(--deep);color:#fff;border-color:var(--deep);box-shadow:0 30px 60px -40px rgba(45,32,71,.9)}
.offer .eyebrow{font-size:10px}.offer.main .eyebrow{color:#cdbff0}
.offer h3{font:400 clamp(20px,1.9vw,26px)/1.15 var(--serif);margin:4px 0 2px}
.offer .price{font:400 clamp(30px,3vw,42px)/1 var(--serif);margin:10px 0 2px}
.offer .price small{font:500 13px var(--sans);display:block;margin-top:6px;color:var(--muted)}
.offer.main .price small{color:#cdbff0}
.offer ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.offer li::before{content:"— ";color:var(--purple-2)}
.offer .tag{display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;background:var(--lilac);color:var(--purple);border-radius:99px;padding:4px 10px;font-weight:700;width:max-content}
.offer.main .tag{background:#7a5fcf;color:#fff}
.offer .muted{color:var(--muted);font-size:13px}
.offer.main .muted{color:#b9afd6}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--paper);margin-bottom:18px}
.toggle button{border:0;background:transparent;padding:7px 14px;border-radius:99px;font-size:13px;color:var(--muted)}
.toggle button.on{background:var(--ink);color:#fff}
.open{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:30px}
.open div{background:var(--paper);border:1px dashed var(--lilac-2);border-radius:12px;padding:14px;font-size:13.5px}
.open b{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--purple);margin-bottom:4px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:30px}
.chip{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chip img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chip b{display:block;font-size:13.5px;line-height:1.15}.chip small{display:block;color:var(--muted);font-size:11.5px}
.chip .k{width:22px;height:22px;border-radius:50%;background:var(--lilac);color:var(--purple);font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 22px}
.chip.seed .k{background:var(--gold);color:#fff}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;margin:0 0 20px}
.label{position:absolute;bottom:22px;right:56px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
@media(max-width:900px){
 .deck{display:block;height:auto;overflow:visible}
 .page{flex:none;min-height:0;padding:22px 20px 60px;border-bottom:1px solid var(--line)}
 .visual,.steps,.detail,.spiral,.offers,.open,.flow{grid-template-columns:1fr}
 .visual::before,.flow::before{display:none}
 .flow{gap:16px}.node .n{margin:0}
 .chips{grid-template-columns:1fr 1fr}.order{grid-template-columns:1fr}
 .nav{display:none}.label{position:static;margin-top:20px}
}

/* value staircase */
.stair{margin-bottom:22px;background:radial-gradient(900px 420px at 80% -20%,rgba(138,111,211,.45),transparent 60%),radial-gradient(600px 300px at 0% 110%,rgba(201,162,79,.18),transparent 60%),linear-gradient(160deg,#1b1433,#2d2047 70%,#3a2a6a);color:#fff;border-radius:18px;padding:26px 30px 20px;position:relative;overflow:hidden;box-shadow:0 40px 80px -50px rgba(27,20,51,.9)}
.stair .eyebrow{color:#cdbff0}
.stair h3{font:400 clamp(26px,3vw,40px)/1.1 var(--serif);margin:6px 0 4px;letter-spacing:-.01em}
.stair h3 em{font-style:normal;font-family:var(--sans);font-weight:800;background:linear-gradient(90deg,#e9dcff,#b79bf0 60%,#8a6fd3);-webkit-background-clip:text;background-clip:text;color:transparent}
.stair .sub2{color:#b9afd6;margin:0 0 26px;font-size:15px}
.steps4{display:grid;grid-template-columns:1fr 1.05fr 1.35fr 1fr;gap:12px;align-items:end;position:relative}
.steps4::before{content:"";position:absolute;left:4%;right:4%;top:-8px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(201,162,79,.7) 70%,rgba(255,255,255,.1))}
.st{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px 18px 16px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:4px;transition:all .2s;position:relative}
.st:nth-child(1){min-height:130px}.st:nth-child(2){min-height:165px}.st:nth-child(3){min-height:225px}.st:nth-child(4){min-height:175px}
.st .eb{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#cdbff0;font-weight:700}
.st .ttl{font:400 18px/1.2 var(--serif);margin-top:4px}
.st .pr{font:400 clamp(26px,2.6vw,36px)/1 var(--serif);margin:10px 0 2px}
.st .pr small{display:block;font:500 12px var(--sans);color:#b9afd6;margin-top:6px}
.st .meta{font-size:12.5px;color:#b9afd6;margin-top:auto;padding-top:10px}
.st.hero{background:linear-gradient(180deg,rgba(138,111,211,.35),rgba(90,63,180,.25));border-color:rgba(201,162,79,.8);box-shadow:0 0 0 1px rgba(201,162,79,.25),0 30px 60px -30px rgba(138,111,211,.9)}
.st.hero .pr{font-size:clamp(34px,3.6vw,50px)}
.st.hero::after{content:"";position:absolute;inset:-1px;border-radius:14px;pointer-events:none;box-shadow:inset 0 0 40px rgba(201,162,79,.12)}
.st.ghost{opacity:.6;border-style:dashed}
.st:hover,.st[aria-pressed=true]{transform:translateY(-4px);border-color:#e9dcff}
.timeline{display:grid;grid-template-columns:1fr 1.05fr 1.35fr 1fr;gap:12px;margin-top:12px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#b9afd6;text-align:center}
.timeline span{border-top:1px solid rgba(255,255,255,.15);padding-top:8px}
.anchor{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:22px;align-items:stretch}
.anchor .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px 18px;font-size:13.5px;color:#e6dff5}
.anchor .box b{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#cdbff0;margin-bottom:6px}
.anchor .sum{background:#fff;color:var(--ink);border-radius:12px;padding:18px 20px}
.anchor .sum .eb{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.anchor .sum .big{font:400 clamp(28px,3vw,40px)/1 var(--serif);margin:8px 0 2px}
.anchor .sum .ln{border-top:1px solid var(--line);margin:12px 0;padding-top:12px;font-size:14px}
.anchor .sum .ln b{display:block;margin-bottom:4px}
.anchor .sum .res{display:block;background:var(--lilac);color:var(--purple);border-radius:8px;padding:10px 12px;text-align:center;font-size:13px;font-weight:600;margin-top:10px}
.fine{font-size:11.5px;color:#9f95bd;margin:18px 0 0;line-height:1.5}
@media(max-width:900px){.steps4,.timeline,.anchor{grid-template-columns:1fr}.st{min-height:0!important}.stair{padding:24px 20px}}

@media print{.nav{display:none}.page{page-break-after:always;min-height:0;height:auto}}
</style>
</head>

}[L];
const bar=(n)=>`<div class="bar"><span>${esc(S.top)}<span class="lang"><button ${L==='pt'?'class="on"':''} data-lang="pt">PT</button><button ${L==='en'?'class="on"':''} data-lang="en">EN</button></span></span><span>0${n} / 05</span></div>`;
const steps=a=>`<div class="steps">${a.map(s=>`<div><span class="eyebrow">${esc(s[0])}</span><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p></div>`).join('')}</div>`;
const head=(p)=>`<p class="statement">${esc(p.st)}</p><p class="sub">${esc(p.sub)}</p><span class="eyebrow">${esc(p.eb)}</span><h2>${esc(p.h)}</h2><p class="lead">${esc(p.lead)}</p>`;
function wheel(on){const cx=120,cy=120,R=100;const ang=i=>(-90+i*45)*Math.PI/180;const P=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];let h=`<svg class="wheel" viewBox="0 0 240 240">`;
 AREAS.forEach((a,i)=>{const p1=P(i,R),p2=P(i+1,R);h+=`<polygon class="${i===on?'on':''}" data-i="${i}" points="${cx},${cy} ${p1.join(',')} ${p2.join(',')}"><title>${esc(t(a.n))}</title></polygon>`});
 AREAS.forEach((a,i)=>{const m=(ang(i)+ang(i+1))/2;h+=`<text x="${cx+Math.cos(m)*(R-30)}" y="${cy+Math.sin(m)*(R-30)}" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`});
 return h+`<circle cx="${cx}" cy="${cy}" r="22" fill="#fff"/></svg>`}
const ARCS=[[0,'M165,288 A21,21 0 0 1 144,267'],[1,'M144,267 A34,34 0 0 1 178,233'],[2,'M178,233 A55,55 0 0 1 233,288'],[3,'M233,288 A89,89 0 0 1 144,377'],[4,'M144,377 A144,144 0 0 1 0,233'],[5,'M0,233 A233,233 0 0 1 233,0'],[6,'M233,0 A377,377 0 0 1 610,377']];
const SQ=[[144,267,21],[144,233,34],[178,233,55],[144,288,89],[0,233,144],[0,0,233],[233,0,377]];
const DEEP=['#c9b6ef','#b9a0e6','#a98cdd','#9478d2','#7f64c6','#6a50b8','#5a3fb4'];
function spiral(){let h=`<svg viewBox="-16 -16 642 409" aria-hidden="true">`;SQ.forEach((q,k)=>h+=`<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[2]}" fill="${DEEP[k]}" opacity=".18"/><rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[2]}" fill="none" stroke="#c9a24f" stroke-width="1" opacity=".6"/>`);
 ARCS.forEach(([k,d])=>h+=`<path d="${d}" stroke="${DEEP[k]}" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ${k*.2}s ease-out forwards"/>`);
 h+=`<circle cx="165" cy="267" r="5" fill="#c9a24f"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>`;return h+'</svg>'}
function pathList(cls){if(!TR)return'';const order=TR.order(Array(8).fill(4),prio);let n=0;return order.map((i,k)=>{const p=TR.resolve(i,{});const seed=!!p.incluido;if(!seed)n++;return `<li class="${seed?'seed':''}" style="animation-delay:${k*70}ms"><span class="k">${seed?'★':n}</span><img src="${img(p.especialista)}" alt=""><span><b>${i+1} — ${esc(t(AREAS[i].n))}</b><small>${esc(p.programa||'')} · ${esc(p.especialista||'')}</small></span></li>`}).join('')}
function chips(){if(!TR)return'';const order=TR.order(Array(8).fill(4),prio);let n=0;return order.map(i=>{const p=TR.resolve(i,{});const seed=!!p.incluido;if(!seed)n++;return `<div class="chip ${seed?'seed':''}"><span class="k">${seed?'★':n}</span><img src="${img(p.especialista)}" alt=""><span><b>${esc(p.programa||'')}</b><small>${i+1} — ${esc(t(AREAS[i].n))} · ${esc(p.especialista||'')}</small></span></div>`}).join('')}
function firstProgram(){const p=TR?TR.resolve(prio,{}):{};return p}
const pages=[
 ()=>{const p=S.p1;return bar(1)+head(p)+`<div class="flow">${p.nodes.map((n,i)=>`<button class="node" data-node="${i}" aria-pressed="${i===0}"><span class="n">${i+1}</span><b>${esc(n[0])}</b><small>${esc(n[1])}</small></button>`).join('')}</div><div class="detail" id="det"></div>`+steps(p.steps)},
 ()=>{const p=S.p2,fp=firstProgram();return bar(2)+head(p)+`<div class="visual"><div id="w2">${wheel(prio)}</div><div class="card"><span class="eyebrow">${esc(p.c1)}</span><div class="big" id="c1">${prio+1} — ${esc(t(AREAS[prio].n))}</div><small>${esc(p.c1s)}</small></div><div class="card dark"><span class="eyebrow">${esc(p.c2)}</span><div class="play"></div><img id="c2img" src="${img(fp.especialista)}" alt="" style="width:54px;height:54px;border-radius:50%;object-fit:cover;margin-bottom:10px"><div class="big" id="c2">${esc(fp.programa||'')}</div><small id="c2s">${esc(fp.especialista||'')} · ${esc(p.c2s)}</small></div></div>`+steps(p.steps)},
 ()=>{const p=S.p3;return bar(3)+head(p)+`<div class="spiral"><div>${spiral()}</div><ol class="order" id="order">${pathList()}</ol></div>`+steps(p.steps)},
 ()=>{const p=S.p4;return bar(4)+`<p class="statement">${esc(p.st)}</p><p class="sub">${esc(p.sub)}</p><span class="eyebrow">${esc(p.eb)}</span>`+`<div class="stair" style="margin-top:12px"><span class="eyebrow">${esc(p.h)}</span><h3>${p.big}</h3><p class="sub2">${esc(p.big2)}</p>
  <div class="steps4">${p.rows.map((x,i)=>`<button class="st${i===2?' hero':''}${i===3?' ghost':''}" data-st="${i}" aria-pressed="${i===2}"><span class="eb">${esc(x[2])}</span><span class="ttl">${esc(x[0])}</span><span class="pr">${esc(x[1])}</span><span class="meta">${esc(x[3])}</span></button>`).join('')}</div>
  <div class="timeline">${p.tl.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
  <div class="anchor"><div class="box"><b>${esc(p.anchorT)}</b>${esc(p.anchor)}</div><div class="sum"><span class="eb">${esc(p.sumT)}</span><div class="big" id="sumPrice">${esc(A.preco||'R$997 à vista').replace(/ à vista$/,'')}</div><div style="color:var(--muted);font-size:14px">${esc(p.cash)}</div><div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(p.inst)}</div><div class="ln"><b>${esc(p.r1)}</b><span style="color:var(--muted);font-size:13px">${esc(p.r1s)}</span></div><div class="ln" style="margin-top:0"><b>${esc(p.r2)}</b><span style="color:var(--muted);font-size:13px">${esc(p.r2s)}</span></div><span class="res">${esc(p.res)}</span></div></div>
  <p class="fine">${esc(p.fine)}</p></div>`+steps(p.steps)},
 ()=>{const p=S.p5;return bar(5)+head(p)+`<div class="chips">${chips()}</div><span class="eyebrow">${esc(p.open)}</span><div class="open" style="margin-top:10px">${p.openItems.map(o=>`<div><b>${esc(o[0])}</b>${esc(o[1])}</div>`).join('')}</div>`+steps(p.steps)+`<span class="label">${esc(S.label)}</span>`}
];
const deck=document.getElementById('deck');
function render(){deck.innerHTML=pages.map((f,i)=>`<section class="page" id="p${i+1}">${f()}</section>`).join('');
 document.getElementById('dots').innerHTML=pages.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
 // page 1 detail
 const det=document.getElementById('det');const showDet=i=>{const d=S.p1.det[i];det.innerHTML=`<div><b>${L==='en'?'What the person sees':'O que a pessoa vê'}</b><p>${esc(d[0])}</p></div><div><b>${L==='en'?'What happens behind':'O que acontece por trás'}</b><p>${esc(d[1])}</p></div><div><b>${L==='en'?'Who / status':'Quem / status'}</b><p>${esc(d[2])}</p></div>`;deck.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed',Number(n.dataset.node)===i))};showDet(0);
 deck.querySelectorAll('.node').forEach(n=>n.onclick=()=>showDet(Number(n.dataset.node)));
 // page 2 wheel → priority (carries to pages 3 and 5)
 const bindWheel=()=>deck.querySelectorAll('#w2 polygon').forEach(pg=>pg.onclick=()=>{prio=Number(pg.dataset.i);document.getElementById('w2').innerHTML=wheel(prio);bindWheel();const fp=firstProgram();document.getElementById('c1').textContent=`${prio+1} — ${t(AREAS[prio].n)}`;document.getElementById('c2').textContent=fp.programa||'';document.getElementById('c2s').textContent=`${fp.especialista||''} · ${S.p2.c2s}`;document.getElementById('c2img').src=img(fp.especialista);document.getElementById('order').innerHTML=pathList();deck.querySelector('.chips').innerHTML=chips()});bindWheel();
 deck.querySelectorAll('.st').forEach(b=>b.onclick=()=>deck.querySelectorAll('.st').forEach(x=>x.setAttribute('aria-pressed',x===b)));
 // page 4 toggle
 deck.querySelectorAll('#tg button').forEach(b=>b.onclick=()=>{deck.querySelectorAll('#tg button').forEach(x=>x.classList.toggle('on',x===b));deck.querySelectorAll('.offer .price[data-cash]').forEach(pr=>{const sm=pr.querySelector('small');const v=b.dataset.m==='cash'?pr.dataset.cash:pr.dataset.inst;pr.firstChild.textContent=v;if(b.dataset.m==='inst')sm.textContent=S.p4.instNote;else sm.textContent=pr.closest('.main')?(A.acessoPrazo||''):(B.acessoPrazo||'')})});
 deck.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const p=new URLSearchParams(location.search);if(b.dataset.lang==='en')p.set('lang','en');else p.delete('lang');location.search=p.toString()});
}
render();
const st=document.createElement('style');st.textContent='@keyframes draw{to{stroke-dashoffset:0}}';document.head.appendChild(st);
let cur=0;const n=pages.length;const goTo=i=>{cur=Math.max(0,Math.min(n-1,i));deck.scrollTo({left:cur*deck.clientWidth,behavior:'smooth'});document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===cur))};
document.getElementById('prev').onclick=()=>goTo(cur-1);document.getElementById('next').onclick=()=>goTo(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')goTo(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')goTo(cur-1)});
deck.addEventListener('scroll',()=>{const i=Math.round(deck.scrollLeft/deck.clientWidth);if(i!==cur){cur=i;document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===cur))}});
})();
